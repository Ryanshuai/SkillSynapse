[project]
name = "skillsynapse"
version = "0.1.0"
description = "Nightly cron that grows Claude Code skills from session logs"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
skillsynapse = "skillsynapse.main:main"
skill = "skillsynapse.commands:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillsynapse = ["*.sql", "*.yaml"]
