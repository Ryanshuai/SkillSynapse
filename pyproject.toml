[project]
name = "skillsynapse"
version = "0.1.0"
description = "Grows Claude Code skills from session logs, run manually"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
skillsynapse = "skillsynapse.main:main"
skill = "skillsynapse.commands:main"
skillmerge = "skillsynapse.merge_conflicts:main"
skillsuggest = "skillsynapse.suggest:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillsynapse = ["*.sql", "*.yaml"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.11"
pyyaml = ">=6.0"

# Install the project itself as editable so the skillsynapse / skill commands work
[tool.pixi.pypi-dependencies]
skillsynapse = { path = ".", editable = true }
